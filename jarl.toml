# Fixture packages under tests/testthat/examples/ are copied and rendered as
# test data, so their functions are never called by altdoc's own code and
# `unused_function` fires on every one of them. Scope the suppression to that
# one rule rather than excluding the directory outright, so any other rule
# jarl gains still reports there (#19).
[lint.per-file-ignores]
"tests/testthat/examples/**" = ["unused_function"]

# Workflow derived from https://github.com/posit-dev/setup-air/tree/main/examples

on:
  push:
    branches: main
  pull_request:

name: Lint

permissions: read-all

jobs:
  jarl-check:
    name: jarl-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA-pinned like every other third-party action here; see
      # `.github/dependabot.yml` for the convention. v0.1.1 also runs on Node
      # 24, where the v0.1.0 tag it replaced runs on Node 20, which the runner
      # warns is deprecated.
      #
      # Pin `version` explicitly too. The input defaults to "", documented as
      # "the version in pyproject.toml or 'latest'", and this repo has no
      # pyproject.toml, so leaving it unset installs whatever jarl released
      # most recently and records nowhere here which version that was. 0.5.0
      # is what the floating setup already resolved to, so this pin records
      # current behavior rather than changing it.
      #
      # Dependabot watches the `uses:` SHA above, but not `version`: that is an
      # action input rather than a `uses:` ref, so it stays invisible and needs
      # a deliberate bump.
      - uses: etiennebacher/setup-jarl@eabf7e572f2991d165059007531b9bbe2987e39c # v0.1.1
        with:
          version: "0.5.0"
          src: >-
            R
            tests/testthat/*.R

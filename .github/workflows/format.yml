name: format

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to a release rather than `latest`, so the version that formats
      # the code is recorded here instead of being whatever had shipped by the
      # time the job ran. Under `latest` a new air release changes this job's
      # behavior with no change in the repo, and since a formatter's output
      # shifts between versions, that surfaces as `air format . --check`
      # failing on files nobody touched.
      #
      # Like the `r-ci-setup` pin in R-CMD-check-no-quarto.yml, this one needs
      # a deliberate manual bump: Dependabot's github-actions ecosystem tracks
      # `uses:` refs, and this is a `curl` URL, so no bump PR will ever arrive
      # for it. See #67.
      - name: Install `air`
        run: curl -LsSf https://github.com/posit-dev/air/releases/download/0.11.0/air-installer.sh | sh
      - name: Check for changes
        run: air format . --check

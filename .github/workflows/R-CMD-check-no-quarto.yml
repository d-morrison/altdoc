# Run CI for R using https://eddelbuettel.github.io/r-ci/

name: R-CMD-check-no-quarto

on:
  push:
    branches: [main, master]
    paths:
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
  pull_request:
    branches: [main, master]
    paths:
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  USE_BSPM: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"
   # Otherwise default is to use "--no-build-vignettes --no-manual --as-cran"
  R_BUILD_ARGS: "--no-manual"
  R_CHECK_ARGS: "--no-manual --no-vignettes --as-cran"
  WARNINGS_ARE_ERRORS: "true"
  R_GH: true
  GITHUB_PAT: ${{ secrets.COVR_GH_PAT }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      # SHA-pinned like every other third-party action here, but this one
      # cannot be kept current the same way: `eddelbuettel/github-actions`
      # publishes no tags or releases at all, so Dependabot has no version to
      # compare against and will never open a bump PR for it. The pin is still
      # worth taking -- `@master` is a mutable branch ref, so whatever lands
      # there runs here unreviewed -- but it needs a deliberate manual bump
      # rather than an automated one. #60 is separately weighing whether this
      # workflow should keep using `r-ci` at all, which would retire the
      # question.
      - name: Setup
        uses: eddelbuettel/github-actions/r-ci-setup@6f25da938f36a97de19f40e428b9090f168de45d # master @ 2026-07-26

      - name: Bootstrap
        run: ./run.sh bootstrap

      - name: Dependencies
        run: ./run.sh install_all

      - name: Test
        run: ./run.sh run_tests

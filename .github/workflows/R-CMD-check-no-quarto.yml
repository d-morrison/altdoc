# R CMD check on a runner with no Quarto installed.
#
# The point of this workflow is the *absence* of a Quarto setup step: it checks
# that the package still builds and passes check when Quarto is unavailable,
# which `R-CMD-check.yaml` cannot cover because it installs Quarto on every
# platform. Do not add a `quarto-dev/quarto-actions/setup` step here.

name: R-CMD-check-no-quarto

on:
  push:
    branches: [main, master]
    paths:
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
      # Re-run when this workflow itself changes, so a change to how the check
      # is set up is exercised by the PR that makes it. Without this, a PR
      # touching only this file gets no run at all and lands unverified.
      - .github/workflows/R-CMD-check-no-quarto.yml
  pull_request:
    branches: [main, master]
    paths:
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
      # Re-run when this workflow itself changes, so a change to how the check
      # is set up is exercised by the PR that makes it. Without this, a PR
      # touching only this file gets no run at all and lands unverified.
      - .github/workflows/R-CMD-check-no-quarto.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  GITHUB_PAT: ${{ secrets.COVR_GH_PAT }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # `build_args`/`args` carry over what the retired `r-ci` run set through
      # `R_BUILD_ARGS`/`R_CHECK_ARGS`, and `error-on: warning` is the
      # equivalent of its `WARNINGS_ARE_ERRORS: true`. Both are stated
      # explicitly rather than left to the action's defaults, because the
      # combination is deliberate: vignettes are built (no
      # `--no-build-vignettes` in `build_args`) but not re-run at check time
      # (`--no-vignettes`).
      # Each value is interpolated into an R call as `args = (...)`, so a
      # multi-element value has to be a real `c()` expression.
      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          build_args: '"--no-manual"'
          args: 'c("--no-manual", "--no-vignettes", "--as-cran")'
          error-on: '"warning"'

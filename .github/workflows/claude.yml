# Migrated to the reusable workflow in Morrison-Lab/gha (claude.yml).
#
# The reusable workflow carries the agent-mode machinery that used to live here:
# the @claude acknowledgment, per-PR concurrency, the late-comment polling loop,
# branch setup + push + draft-PR for issue triggers, the prose-response post
# (with in-thread replies on review comments), and the review re-dispatch. This
# stub supplies altdoc-specific configuration -- install-quarto (altdoc's own
# test suite renders Quarto docs and needs the CLI) and a prompt-addendum with
# this repo's lint/format/test/document conventions -- plus the caller-side
# trusted-author gate documented on the job's `if:` below.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Cheap caller-side gate: only invoke the reusable workflow when an @claude
    # mention is present AND the author is trusted (OWNER/MEMBER/COLLABORATOR),
    # so an untrusted commenter's mention doesn't even spawn the
    # reusable-workflow run. This mirrors the reusable workflow's own
    # trusted-author gate as defense-in-depth: without it, the run still gets
    # skipped downstream, but only after invoking a workflow that was granted
    # elevated permissions and passed secrets.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # actions: write is required so the reusable workflow can re-dispatch
      # claude-code-review.yml via workflow_dispatch after pushing commits.
      actions: write
    uses: Morrison-Lab/gha/.github/workflows/claude.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Max-plan OAuth; empty when using API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # direct API key; empty when using OAuth
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
    with:
      install-quarto: true
      prompt-addendum: |
        This is the altdoc R package. Before committing, run
        devtools::load_all() (required before linting so
        object_usage_linter does not report false positives), then
        `jarl check` (lint), `air format . --check` (formatting),
        spelling::spell_check_package() (add new terms to
        inst/WORDLIST), and devtools::test(); run devtools::document()
        after roxygen2 changes; and add a NEWS.md bullet for
        user-facing changes.

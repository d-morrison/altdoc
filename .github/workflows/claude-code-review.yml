# Migrated to the reusable workflow in d-morrison/gha (claude-code-review.yml).
# The reusable workflow carries the reviewer stash/restore, the inline-comment
# tool allowlist, review-only enforcement, the collapse/cancel handling, the
# `/review` on-demand dispatch, and the workflow_dispatch path claude.yml uses
# to re-dispatch a review after pushing commits.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  # `/review` at the start of a PR comment (from an OWNER/MEMBER/COLLABORATOR)
  # dispatches an on-demand review of that PR, independent of claude.yml.
  dispatch-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write        # dispatch this workflow via `gh workflow run`
      issues: write         # acknowledge the /review comment
    steps:
      - name: Parse this workflow's ref
        id: this-wf
        uses: d-morrison/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Dispatch a review for the commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
          # Passed via env (not inlined) so the comment body is a shell value,
          # never interpreted as script -- avoids injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The job-level `if:` only does a cheap startsWith('/review') pre-filter;
          # GitHub Actions expressions can't reliably tell '/review' from
          # '/reviewer' or handle a newline/tab after the command. Enforce the real
          # match here: the body must begin with a standalone '/review' token,
          # followed by whitespace (space/tab/newline) or end-of-string.
          if [[ ! "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            echo "Comment does not start with a standalone '/review' command; skipping dispatch."
            exit 0
          fi
          # This workflow's filename, so the dispatch resolves whatever you
          # name the file -- WF_PATH is the .github/workflows/<file> portion.
          WF_FILE=$(basename "$WF_PATH")
          # This job never checks out the repo, so the PR's head branch has to
          # be looked up explicitly. --ref pins the dispatched run's check-runs
          # to that branch instead of the default branch workflow_dispatch
          # falls back to when no ref is given -- without it, a required
          # review check-run can land on the wrong commit (d-morrison/gha#285).
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          echo "Dispatching $WF_FILE to review PR #$PR_NUMBER ($PR_BRANCH) (/review comment)."
          # A fork PR's head branch only exists in the fork, not in $REPO, so
          # --ref would fail to resolve there. Fall back to no --ref for fork
          # PRs; the resulting check-run mis-attributes to the default branch
          # (the no-ref behavior), the lesser problem.
          REF_ARGS=(--ref "$PR_BRANCH")
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching $WF_FILE without --ref."
            REF_ARGS=()
          fi
          gh workflow run "$WF_FILE" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"
          gh issue comment "$PR_NUMBER" --repo "$REPO" \
            --body ":mag: \`/review\` received -- dispatched a Claude review of this PR (see the [dispatch run]($RUN_URL)). The review posts as its own comment when it finishes." \
            || echo "::warning::Could not acknowledge the /review comment."

  review:
    # pull_request and workflow_dispatch only; the issue_comment path is
    # handled by dispatch-on-comment above (which re-enters via
    # workflow_dispatch).
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
    uses: d-morrison/gha/.github/workflows/claude-code-review.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Max-plan OAuth; empty when using API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # direct API key; empty when using OAuth
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
    with:
      # Wires the workflow_dispatch input through so claude.yml can
      # re-dispatch a review on Claude's commits; empty (and ignored) for
      # pull_request runs.
      pr-number: ${{ inputs.pr_number }}

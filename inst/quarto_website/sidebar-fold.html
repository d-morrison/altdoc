<!--
Adds a navbar control that folds the whole sidebar away and gives the content
the width it held. Quarto's `collapse-level` folds sections *within* the
sidebar; it has no control for the sidebar itself on a website.

This file is altdoc's, not the user's: `render_docs()` stages it into
`_quarto/` when a settings file uses `$ALTDOC_SIDEBAR_FOLD`, and rewrites the
`@ALTDOC_FOLD_DEFAULT@` placeholder below from the `sidebar_fold` key in
`altdoc/reference.yml`. Editing a copy under `altdoc/` will not change the
published site.

The style and the script ship together because they are two halves of one
mechanism: both name the `sidebar-folded` class and the `quarto-sidebar-fold`
id, and splitting them across a stylesheet the user maintains would let one
half move without the other.

Included as `include-in-header` rather than `include-after-body`, so the stored
state is restored before the first paint and an already-folded sidebar never
flashes into view. The state lives on `<html>` for the same reason: `<body>`
does not exist yet when this runs.
-->
<style>
  /* Below Quarto's own breakpoint the sidebar is already a drawer laid over
     the content, so it holds no width to reclaim and needs no second
     control. */
  #quarto-sidebar-fold {
    display: none;
  }

  @media (min-width: 992px) {
    #quarto-sidebar-fold {
      display: inline-flex;
    }

    html.sidebar-folded #quarto-sidebar {
      display: none;
    }

    /* The sidebar spans `page-start` to `body-start`, so moving the content's
       start line leftward takes back the columns it vacated. Naming a grid
       line rather than restating the whole template keeps this independent of
       whatever `sidebar-width` the site sets under `format: html: grid:`.

       `page-start-inset` rather than `page-start`: the latter reclaims the
       outermost track too, which at a 1400px viewport leaves the text 26px
       from the window edge. Measured at 1400px, against 630px of content
       unfolded: `page-start` gives 990px at a 26px margin, `page-start-inset`
       922px at 94px, and `body-start-outset` only 724px. The middle one buys
       most of the width without pushing the text against the edge. */
    html.sidebar-folded #quarto-content > .content {
      grid-column-start: page-start-inset;
    }

    /* One icon for both states, mirrored, so the button cannot depend on a
       second icon name being present in the bundled Bootstrap Icons build. */
    html.sidebar-folded #quarto-sidebar-fold .bi {
      transform: scaleX(-1);
    }
  }
</style>
<script>
  (function () {
    var KEY = "altdoc-sidebar-folded";
    var FOLDED_BY_DEFAULT = @ALTDOC_FOLD_DEFAULT@;
    var root = document.documentElement;

    function apply(folded) {
      root.classList.toggle("sidebar-folded", folded);
      var button = document.getElementById("quarto-sidebar-fold");
      if (!button) return;
      var label = folded ? "Show sidebar" : "Hide sidebar";
      button.setAttribute("aria-expanded", String(!folded));
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    }

    // Only the two values this script writes are honored, so the configured
    // default applies to a reader who has never used the button and to one
    // whose stored value is unreadable alike. Testing for both rather than
    // for one and treating everything else as its opposite is what lets the
    // default be either state.
    //
    // Private browsing and blocked third-party storage both make localStorage
    // throw rather than return null, so every access is guarded. Losing the
    // preference is acceptable; losing the button is not.
    function stored() {
      try {
        var value = localStorage.getItem(KEY);
        if (value === "1") return true;
        if (value === "0") return false;
      } catch (e) {}
      return FOLDED_BY_DEFAULT;
    }

    apply(stored());

    document.addEventListener("DOMContentLoaded", function () {
      // A page with no sidebar has no width to reclaim, so it gets no button
      // -- and no folded state either. Dropping the class matters when folded
      // is the default: without it, a visitor to such a page would have the
      // content's grid start line moved with no vacated columns to move it
      // into.
      if (!document.getElementById("quarto-sidebar")) {
        root.classList.remove("sidebar-folded");
        return;
      }

      var tools = document.querySelector(".quarto-navbar-tools");
      if (!tools) {
        // `.quarto-navbar-tools` is created only when the site asks for a
        // navbar tool of its own -- a dark-mode switch, reader mode. A theme
        // change should not silently drop the button, so build the container
        // when it is absent.
        var navbar = document.querySelector("#quarto-header .navbar > div");
        if (!navbar) return;
        tools = document.createElement("div");
        tools.className = "quarto-navbar-tools";
        navbar.appendChild(tools);
      }

      var button = document.createElement("a");
      button.id = "quarto-sidebar-fold";
      button.href = "";
      button.className = "quarto-navigation-tool px-1";
      button.setAttribute("role", "button");
      button.setAttribute("aria-controls", "quarto-sidebar");
      button.innerHTML = '<i class="bi bi-layout-sidebar-inset"></i>';
      button.addEventListener("click", function (event) {
        event.preventDefault();
        var folded = !root.classList.contains("sidebar-folded");
        try {
          localStorage.setItem(KEY, folded ? "1" : "0");
        } catch (e) {}
        apply(folded);
      });

      tools.insertBefore(button, tools.firstChild);
      apply(root.classList.contains("sidebar-folded"));
    });
  })();
</script>

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: altdoc

jobs:
  altdoc:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: altdoc-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      $ALTDOC_MKDOCS_START
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          architecture: x64

      - name: Install Mkdocs and its dependencies
        run: |
          python -m venv .venv_altdoc
          source .venv_altdoc/bin/activate
          python3 -m pip install --upgrade pip     # install pip
          python3 -m pip install mkdocs            # install mkdocs

      # Uncomment this if you use "theme: material" in `altdoc/mkdocs.yml`
      # - name: Install Material for Mkdocs
      #   run: |
      #     python3 -m pip install mkdocs-material   # install material theme
      $ALTDOC_MKDOCS_END
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload

      - name: Build site
        run: |
          # If parallel = TRUE in render_docs()
          # future::plan(future::multicore)
          install.packages(".", repos = NULL, type = "source")
          pkgload::load_all()
          altdoc::render_docs(parallel = FALSE, freeze = FALSE)
        shell: Rscript {0}
      $ALTDOC_MULTIVERSION_START
      - name: Resolve docs ref
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ALTDOC_DOCS_REF=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "ALTDOC_DOCS_REF=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      $ALTDOC_MULTIVERSION_END

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
          $ALTDOC_MULTIVERSION_START
          target-folder: ${{ env.ALTDOC_DOCS_REF }}
          $ALTDOC_MULTIVERSION_END

  $ALTDOC_MULTIVERSION_START
  multi-version-docs:
    needs: altdoc
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Build multi-version landing page
        uses: insightsengineering/r-pkgdown-multiversion@v3
        with:
          path: .
          default-landing-page: "$ALTDOC_DEFAULT_LANDING_PAGE"
          refs-order: "$ALTDOC_REFS_ORDER"
          branches-or-tags-to-list: '$ALTDOC_BRANCHES_OR_TAGS_TO_LIST'
  $ALTDOC_MULTIVERSION_END
